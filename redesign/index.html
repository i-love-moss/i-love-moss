<style>

     2. CSS VARIABLES — the whole page's "theme" lives here.

  :root {

    --ink:        #007618;   /* primary text is green, not black */

    --card:       #E9F4EA;   /* pale mint — card / hover background */

    --accent-soft:#AFE1A8;   /* soft green-lime, for gradients and chips */

    /* Type — Commit Mono for headings/subheadings, Times New Roman for body copy */
    --display: 'Commit Mono', 'IBM Plex Mono', monospace;
    --body:    'Times New Roman', Times, serif;

    /* Layout */
    --max-w: 760px;
    --gutter: 24px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  img { max-width: 100%; display: block; }

  a { color: inherit; }

  .wrap {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 var(--gutter);

  /* -------- Reading progress bar -------- */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;

    width: 0%;
    background: var(--accent);

  /* -------- Nav -------- */

  .nav-inner {

    padding: 16px var(--gutter);

    align-items: center;

  .nav-inner .logo {

  .nav-links {

<script>
  // 5. JS — three small, independent behaviors.

  // --- Reading progress bar ---
  // Calculates how far down the page the user has scrolled and
  // sets the width of the top bar to match.
  const progressBar = document.getElementById('progress-bar');
  function updateProgress() {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    progressBar.style.width = pct + '%';
  }
  window.addEventListener('scroll', updateProgress);
  updateProgress();

  // --- Mobile nav toggle ---
  const navToggle = document.getElementById('nav-toggle');
  const navLinks = document.getElementById('nav-links');
  navToggle.addEventListener('click', () => {
    navLinks.classList.toggle('open');
  });

  // --- Count-up numbers when they scroll into view ---
  // Reads the target number from data-count-to and animates from 0 to it.
  const statEls = document.querySelectorAll('[data-count-to]');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        animateCount(entry.target);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.5 });
  statEls.forEach(el => observer.observe(el));

  function animateCount(el) {
    const target = parseFloat(el.getAttribute('data-count-to'));
    const suffix = el.getAttribute('data-suffix') || '%';
    const duration = 1200;
    const start = performance.now();

    function step(now) {
      const progress = Math.min((now - start) / duration, 1);
      const current = (progress * target).toFixed(target % 1 !== 0 ? 1 : 0);
      el.textContent = current + suffix;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // --- Before/after compare slider ---
  // Dragging across the .compare box moves the clip-path on the
  // "after" layer, revealing more or less of it.
  const compareEl = document.getElementById('compare-slider');
  const afterLayer = compareEl.querySelector('.after');
  const handle = compareEl.querySelector('.handle');
  let dragging = false;

  function setSlider(clientX) {
    const rect = compareEl.getBoundingClientRect();
    let pct = ((clientX - rect.left) / rect.width) * 100;
    pct = Math.max(0, Math.min(100, pct));
    afterLayer.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
    handle.style.left = pct + '%';
  }

  compareEl.addEventListener('mousedown', (e) => { dragging = true; setSlider(e.clientX); });
  window.addEventListener('mousemove', (e) => { if (dragging) setSlider(e.clientX); });
  window.addEventListener('mouseup', () => dragging = false);
  compareEl.addEventListener('touchstart', (e) => setSlider(e.touches[0].clientX));
  compareEl.addEventListener('touchmove', (e) => setSlider(e.touches[0].clientX));
</script>
